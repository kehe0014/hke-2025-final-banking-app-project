name: 'Docker Build and Push'
description: 'Build and push Docker image'

inputs:
  registry:
    required: true
  image_name:
    required: true
  image_tag:
    required: true
  dockerhub_username:
    required: true
  dockerhub_token:
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build and push Docker image
      shell: bash
      run: |
        docker build -t ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }} .
        docker push ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
        
        # Tag latest only for main branch
        if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          docker tag ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }} ${{ inputs.registry }}/${{ inputs.image_name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.image_name }}:latest
          echo "✅ Latest tag updated"
        fi
        
        echo "✅ Image pushed: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"