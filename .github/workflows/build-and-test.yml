name: Build and Test

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

outputs:
  image-tag:
    description: "Generated image tag"
    value: ${{ steps.tag.outputs.tag }}
  environment:
    description: "Target environment"
    value: ${{ steps.env.outputs.environment }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
    - name: Checkout application code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine environment
      id: env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "environment=staging" >> $GITHUB_OUTPUT
        else
          echo "environment=development" >> $GITHUB_OUTPUT
        fi
        echo "Target environment: $(cat $GITHUB_OUTPUT | grep environment | cut -d'=' -f2)"

    - name: Generate image tag
      id: tag
      run: |
        chmod +x .github/scripts/generate-tag.sh
        ./.github/scripts/generate-tag.sh

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.tag.outputs.tag }} .
        docker push ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.tag.outputs.tag }}
        
        # Tag latest only for main branch
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          docker tag ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.tag.outputs.tag }} ${{ inputs.registry }}/${{ inputs.image_name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.image_name }}:latest
          echo "✅ Latest tag updated"
        fi
        
        echo "✅ Image pushed: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.tag.outputs.tag }}"

    - name: Run application tests
      run: |
        echo "🧪 Running application tests..."
        # docker run --rm ${{ inputs.registry }}/${{ inputs.image_name }}:${{ steps.tag.outputs.tag }} python manage.py test
        echo "✅ Tests completed (placeholder)"