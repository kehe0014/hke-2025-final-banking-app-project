name: Build and Test

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Debug inputs
      run: |
        echo "🎯 BUILD INPUTS:"
        echo "registry: ${{ inputs.registry }}"
        echo "image_name: ${{ inputs.image_name }}"
        echo "environment: ${{ inputs.environment }}"
        echo "image_tag: ${{ inputs.image_tag }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        echo "🐳 Building: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
        docker build -t ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }} .
        docker push ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
        
        # Tag latest for production
        if [[ "${{ inputs.environment }}" == "production" ]]; then
          echo "🏷️  Tagging latest for production"
          docker tag ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_tag }} ${{ inputs.registry }}/${{ inputs.image_name }}:latest
          docker push ${{ inputs.registry }}/${{ inputs.image_name }}:latest
        fi
        
        echo "✅ Image pushed successfully"