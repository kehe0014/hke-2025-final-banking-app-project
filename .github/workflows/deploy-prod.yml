name: Deploy Banking App to Production

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: tdksoft341/tdk-banking-app
  K8S_NAMESPACE: banking-app-prod

jobs:
  # JOB 1: Build et tests
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate image tag
      id: tag
      run: |
        # Utiliser le SHA du commit comme tag
        echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} .

    - name: Run security scan
      run: |
        echo "Security scan would run here (Trivy, etc.)"

    - name: Push Docker image
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

    - name: Simple syntax check
      run: |
        cd src
        python -m py_compile bankingsystem/settings.py
        python -m py_compile manage.py
        echo "✅ Syntaxe Python valide"

  # JOB 2: Déploiement en production
  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure Kubernetes
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Verify cluster access
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Create namespace
      run: |
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy Redis
      run: |
        kubectl apply -f k8s/redis-deployment-prod.yaml -n ${{ env.K8S_NAMESPACE }}
        echo "✅ Redis déployé"

    - name: Deploy Banking App
      run: |
        # Mettre à jour l'image dans le deployment
        sed "s|tdksoft341/tdk-banking-app:v1.0.0|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}|g" k8s/deployment-prod.yaml > k8s/deployment-prod-temp.yaml
        kubectl apply -f k8s/deployment-prod-temp.yaml -n ${{ env.K8S_NAMESPACE }}
        rm k8s/deployment-prod-temp.yaml
        echo "✅ Banking App déployée"

    - name: Deploy Services
      run: |
        kubectl apply -f k8s/service-prod.yaml -n ${{ env.K8S_NAMESPACE }}
        echo "✅ Services déployés"

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/banking-app -n ${{ env.K8S_NAMESPACE }} --timeout=300s
        echo "✅ Rollout terminé avec succès"

    - name: Run database migrations
      run: |
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py migrate
        echo "✅ Migrations exécutées"

    - name: Collect static files
      run: |
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py collectstatic --noinput
        echo "✅ Fichiers statiques collectés"

    - name: Verify deployment
      run: |
        echo "📊 Statut du déploiement:"
        kubectl get all -n ${{ env.K8S_NAMESPACE }}
        
        echo "🔍 Logs de l'application:"
        kubectl logs -n ${{ env.K8S_NAMESPACE }} deployment/banking-app --tail=5
        
        echo "🌡️  Ressources utilisées:"
        kubectl top pods -n ${{ env.K8S_NAMESPACE }} || echo "Metrics server non disponible"

    - name: Health check
      run: |
        # Test interne du health check
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- curl -s http://localhost:8000/health-check/ || echo "⚠️  Health check interne échoué"
        echo "✅ Health check terminé"

    - name: Deployment success notification
      run: |
        echo "🚀 BANKING APP DÉPLOYÉE AVEC SUCCÈS EN PRODUCTION!"
        echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}"
        echo "🏷️  Namespace: ${{ env.K8S_NAMESPACE }}"
        echo "⏰ Déployé à: $(date)"