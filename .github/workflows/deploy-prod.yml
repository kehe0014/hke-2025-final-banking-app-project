name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: tdksoft341/tdk-banking-app
  K8S_NAMESPACE: banking-app-prod

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate image tag
      id: tag
      run: |
        echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Configure Kubernetes
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Verify cluster access
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Ensure secrets exist
      run: |
        # Créer les secrets s'ils n'existent pas
        if ! kubectl get secret banking-app-secrets -n ${{ env.K8S_NAMESPACE }} > /dev/null 2>&1; then
          echo "🔐 Création des secrets..."
          kubectl create secret generic banking-app-secrets -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=SECRET_KEY='prod-secret-$(date +%s)' \
            --from-literal=DATABASE_URL='sqlite:///db.sqlite3'
        else
          echo "✅ Secrets déjà existants"
        fi

    - name: Deploy Application Stack
      run: |
        # Créer le namespace si nécessaire
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
        
        # Déployer Redis
        kubectl apply -f k8s/redis-deployment-prod.yaml -n ${{ env.K8S_NAMESPACE }}
        
        # Mettre à jour l'image du deployment
        kubectl set image deployment/banking-app banking-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} -n ${{ env.K8S_NAMESPACE }}
        
        # Appliquer les services
        kubectl apply -f k8s/service-prod.yaml -n ${{ env.K8S_NAMESPACE }}

    - name: Wait for rollout
      run: |
        echo "🔄 Attente du déploiement..."
        kubectl rollout status deployment/banking-app -n ${{ env.K8S_NAMESPACE }} --timeout=600s

    - name: Run database migrations
      run: |
        echo "🗃️ Exécution des migrations..."
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py migrate

    - name: Collect static files
      run: |
        echo "📦 Collecte des fichiers statiques..."
        kubectl exec -n ${{ env.KUS_NAMESPACE }} deployment/banking-app -- python manage.py collectstatic --noinput

    - name: Verify deployment
      run: |
        echo "🎉 DÉPLOIEMENT RÉUSSI!"
        echo "📊 Statut:"
        kubectl get all -n ${{ env.K8S_NAMESPACE }}
        
        echo "🔍 Health check:"
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- curl -s http://localhost:8000/health-check/
        
        echo "🚀 Application déployée: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}"

    - name: Create GitHub deployment
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            environment: 'production',
            auto_merge: false,
            description: 'Banking App deployment to production'
          })