name: Deploy to Production - Pro

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: tdksoft341/tdk-banking-app
  K8S_NAMESPACE: banking-app-prod

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate image tag
      id: tag
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
        echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        
        # Tag also as latest
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Security scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        format: sarif
        output: trivy-results.sarif

    - name: Upload security scan results
      uses: github/codeql-action/upload-sarif@v3 # Updated from v2 to v3
      with:
        sarif_file: trivy-results.sarif

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Configure Kubernetes
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Verify cluster access
      run: |
        kubectl cluster-info
        kubectl get nodes

    - name: Ensure secrets exist
      run: |
        if ! kubectl get secret banking-app-secrets -n ${{ env.K8S_NAMESPACE }} > /dev/null 2>&1; then
          echo "🔐 Creating secrets..."
          kubectl create secret generic banking-app-secrets -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=SECRET_KEY='prod-$(date +%s)' \
            --from-literal=DATABASE_URL='sqlite:///db.sqlite3'
        fi

    - name: Deploy Application Stack
      run: |
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/redis-deployment-prod.yaml -n ${{ env.K8S_NAMESPACE }}
        kubectl set image deployment/banking-app banking-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} -n ${{ env.K8S_NAMESPACE }}
        kubectl apply -f k8s/service-prod.yaml -n ${{ env.K8S_NAMESPACE }}

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/banking-app -n ${{ env.K8S_NAMESPACE }} --timeout=600s

    - name: Comprehensive health checks
      run: |
        echo "🔍 Comprehensive health checks..."
        
        # 1. Basic connectivity test
        echo "=== AVAILABLE TOOLS TEST ==="
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- which curl
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- which wget
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- which netstat
        
        # 2. Health check with curl
        echo "=== HEALTH CHECK WITH CURL ==="
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- curl -s -f http://localhost:8000/health-check/
        
        # 3. Network verification
        echo "=== NETWORK VERIFICATION ==="
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- netstat -tln | grep 8000
        
        # 4. Load test
        echo "=== LOAD TEST ==="
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- curl -s http://localhost:8000/ | head -5
        
        # 5. System metrics
        echo "=== SYSTEM METRICS ==="
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- free -h
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- df -h

    - name: Run database operations
      run: |
        echo "🗃️ Database operations..."
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py migrate
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py collectstatic --noinput

    - name: External connectivity test
      run: |
        echo "🌐 External connectivity test..."
        kubectl port-forward -n ${{ env.K8S_NAMESPACE }} svc/banking-app-service 8080:8000 &
        sleep 5
        curl -f http://localhost:8080/health-check/
        pkill -f "kubectl port-forward"

    - name: Final verification
      run: |
        echo "🎉 PROFESSIONAL DEPLOYMENT SUCCESSFUL!"
        echo "📊 Final report:"
        kubectl get all -n ${{ env.K8S_NAMESPACE }}
        
        echo "🔧 Available tools: curl, wget, netstat, ping"
        echo "🚀 Version: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}"
        echo "⏰ Deployed on: $(date -u)"

    - name: Notify success
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        # Here you could add a Slack/Teams/etc. notification.