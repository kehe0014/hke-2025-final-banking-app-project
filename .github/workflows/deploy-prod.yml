name: Deploy Banking App to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: tdksoft341/tdk-banking-app
  K8S_NAMESPACE: banking-app-prod
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    - name: Configure Kubernetes
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy Redis
      run: |
        kubectl apply -f k8s/redis-deployment-prod.yaml -n ${{ env.K8S_NAMESPACE }}

    - name: Deploy Banking App
      run: |
        # Créer une copie temporaire du deployment avec la bonne image
        cp k8s/deployment-prod.yaml k8s/deployment-prod-temp.yaml
        sed -i 's|tdksoft341/tdk-banking-app:v1.0.0|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g' k8s/deployment-prod-temp.yaml
        kubectl apply -f k8s/deployment-prod-temp.yaml -n ${{ env.K8S_NAMESPACE }}
        rm k8s/deployment-prod-temp.yaml

    - name: Deploy Services
      run: |
        kubectl apply -f k8s/service-prod.yaml -n ${{ env.K8S_NAMESPACE }}

    - name: Wait for deployment
      run: |
        kubectl rollout status deployment/banking-app -n ${{ env.K8S_NAMESPACE }} --timeout=300s

    - name: Run migrations
      run: |
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py migrate

    - name: Collect static files
      run: |
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py collectstatic --noinput

    - name: Health check
      run: |
        echo "✅ Déploiement réussi!"
        kubectl get all -n ${{ env.K8S_NAMESPACE }}