name: Deploy to Production - Pro

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: tdksoft341/tdk-banking-app
  K8S_NAMESPACE: banking-app-prod

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Debug file structure
      run: |
        echo "📁 Structure complète du repository:"
        find . -type f -name "*.yaml" -o -name "*.yml" | sort
        echo ""
        echo "📁 Contenu du répertoire k8s:"
        ls -la k8s/ 2>/dev/null || echo "❌ Répertoire k8s non trouvé"
        echo ""
        echo "📁 Contenu racine:"
        ls -la

    - name: Generate image tag
      id: tag
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
        echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify Kubernetes files exist
      run: |
        echo "🔍 Vérification des fichiers Kubernetes..."
        if [ -f "k8s/redis-deployment-prod.yaml" ]; then
          echo "✅ k8s/redis-deployment-prod.yaml existe"
          cat k8s/redis-deployment-prod.yaml
        else
          echo "❌ k8s/redis-deployment-prod.yaml n'existe pas"
          echo "📁 Contenu de k8s/:"
          ls -la k8s/ 2>/dev/null || echo "Répertoire k8s non trouvé"
          exit 1
        fi
        
        if [ -f "k8s/service-prod.yaml" ]; then
          echo "✅ k8s/service-prod.yaml existe"
          cat k8s/service-prod.yaml
        else
          echo "❌ k8s/service-prod.yaml n'existe pas"
          exit 1
        fi

    - name: Configure Kubernetes
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Clean existing resources
      run: |
        echo "🧹 Nettoyage des ressources existantes..."
        # Supprimer les ressources existantes pour un déploiement propre
        kubectl delete deployment banking-app -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
        kubectl delete service banking-app-service -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
        kubectl delete deployment redis -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
        echo "✅ Nettoyage terminé"

    - name: Deploy Application Stack
      run: |
        echo "🚀 Déploiement de l'application..."
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/redis-deployment-prod.yaml -n ${{ env.K8S_NAMESPACE }}
        kubectl apply -f k8s/service-prod.yaml -n ${{ env.K8S_NAMESPACE }}
        
        # Mettre à jour l'image du déploiement avec la nouvelle image
        # kubectl set image deployment/banking-app tdk-banking-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} -n ${{ env.K8S_NAMESPACE }}
    
    - name: Wait for rollout
      run: |
        echo "⏳ Attente du déploiement..."
        kubectl rollout status deployment/banking-app -n ${{ env.K8S_NAMESPACE }} --timeout=600s
        kubectl rollout status deployment/redis -n ${{ env.K8S_NAMESPACE }} --timeout=300s

    - name: Run database operations
      run: |
        echo "🗃️ Opérations base de données..."
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py migrate
        kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/banking-app -- python manage.py collectstatic --noinput

    - name: Final verification
      run: |
        echo "🎉 DÉPLOIEMENT RÉUSSI!"
        echo "📊 État du cluster:"
        kubectl get all -n ${{ env.K8S_NAMESPACE }}
        
        echo "🔍 Logs de l'application:"
        kubectl logs -n ${{ env.K8S_NAMESPACE }} deployment/banking-app --tail=10

    - name: Notify success
      if: success()
      run: |
        echo "✅ Déploiement terminé avec succès!"
