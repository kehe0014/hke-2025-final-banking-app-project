name: GitOps Deployment with Argo CD

on:
  push:
    branches: [ main, develop, feature/* ]
  release:
    types: [ published ]

env:
  REGISTRY: "docker.io"
  IMAGE_NAME: "tdksoft341/tdk-banking-app"
  GITOPS_PATH: "gitops"

jobs:
  determine-context:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine environment
      id: env
      run: |
        echo "🔍 Determining environment from: ${{ github.ref }}"
        
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "✅ Environment: production"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "environment=staging" >> $GITHUB_OUTPUT
          echo "✅ Environment: staging"
        else
          echo "environment=development" >> $GITHUB_OUTPUT
          echo "✅ Environment: development"
        fi

    - name: Generate image tag
      id: tag
      run: |
        echo "🔍 Generating image tag..."
        chmod +x .github/scripts/generate-tag.sh
        ./.github/scripts/generate-tag.sh
        echo "✅ Generated tag: ${{ steps.tag.outputs.tag }}"

  build-and-test:
    needs: determine-context
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-context.outputs.environment }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug build inputs
      run: |
        echo "🎯 BUILD PARAMETERS:"
        echo "Environment: ${{ needs.determine-context.outputs.environment }}"
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        echo "🐳 Building: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }}"
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }} .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }}
        
        # Tag latest for production
        if [[ "${{ needs.determine-context.outputs.environment }}" == "production" ]]; then
          echo "🏷️  Tagging latest for production"
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        fi
        
        echo "✅ Image pushed successfully"

  update-gitops-manifests:
    needs: [determine-context, build-and-test]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-context.outputs.environment }}
    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.WORKFLOW_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Update manifests with new image tag
      run: |
        echo "🚀 Executing update script..."
        chmod +x .github/scripts/update-manifests.sh
        ./.github/scripts/update-manifests.sh \
          "${{ needs.determine-context.outputs.environment }}" \
          "${{ needs.determine-context.outputs.image-tag }}" \
          "${{ env.GITOPS_PATH }}"

    - name: Commit and push changes
      run: |
        echo "📦 Checking for changes..."
        git status
        
        if git diff --quiet; then
          echo "🤷 No changes to commit"
        else
          echo "💾 Committing changes..."
          git add .
          git commit -m "chore: update ${{ needs.determine-context.outputs.environment }} to image ${{ needs.determine-context.outputs.image-tag }} [skip ci]"
          git push https://${{ secrets.WORKFLOW_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          echo "✅ GitOps manifests updated and pushed"
        fi

  argocd-sync:
    needs: [determine-context, update-gitops-manifests]
    if: (needs.determine-context.outputs.environment == 'production' || needs.determine-context.outputs.environment == 'staging') && success()
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-context.outputs.environment }}
    
    steps:
    # =============================================
    # STEP 1: ARGO CD CLI INSTALLATION
    # =============================================
    - name: "🔧 INSTALLATION - Argo CD Command Line Interface"
      run: |
        echo "🎯 STARTING ARGO CD CLI INSTALLATION"
        echo "===================================="
        echo ""
        echo "📥 Downloading latest Argo CD binary..."
        echo "🔗 Source: https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64"
        
        # Download with progress
        curl -L --progress-bar -o argocd-linux-amd64 \
          "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64"
        
        echo "✅ Download completed successfully"
        echo "📊 File size: $(ls -lh argocd-linux-amd64 | awk '{print $5}')"
        echo ""
        
        echo "⚙️  Installing binary to /usr/local/bin/argocd..."
        sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
        
        echo "🧹 Cleaning up temporary file..."
        rm -f argocd-linux-amd64
        
        echo "🔍 Verifying installation..."
        if command -v argocd > /dev/null 2>&1; then
          echo "✅ SUCCESS: Argo CD CLI installed successfully"
          echo "📋 Version: $(argocd version --client --short)"
        else
          echo "❌ FAILED: Unable to install Argo CD CLI"
          exit 1
        fi
        echo ""
        echo "🎉 ARGO CD CLI INSTALLATION COMPLETED"
        echo "===================================="

    # =============================================
    # STEP 2: KUBERNETES CONFIGURATION
    # =============================================
    - name: "⚙️  CONFIGURATION - Kubernetes Cluster Access"
      run: |
        echo "🎯 KUBERNETES ACCESS CONFIGURATION"
        echo "=================================="
        echo ""
        echo "📁 Creating kube config directory..."
        mkdir -p $HOME/.kube
        echo "✅ Directory created: $HOME/.kube"
        echo ""
        
        echo "🎯 Target environment: ${{ needs.determine-context.outputs.environment }}"
        echo ""
        
        # Select configuration based on environment
        if [[ "${{ needs.determine-context.outputs.environment }}" == "production" ]]; then
          echo "🏭 ENVIRONMENT: PRODUCTION"
          echo "📄 Using K8S_PROD_CONFIG..."
          echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
          echo "✅ Production configuration loaded"
        else
          echo "🧪 ENVIRONMENT: STAGING"
          echo "📄 Using K8S_STAGING_CONFIG..."
          echo "${{ secrets.K8S_STAGING_CONFIG }}" | base64 -d > $HOME/.kube/config
          echo "✅ Staging configuration loaded"
        fi
        
        echo ""
        echo "🔐 Applying security permissions..."
        chmod 600 $HOME/.kube/config
        echo "✅ Permissions applied (600)"
        echo ""
        
        echo "🔍 Testing cluster connection..."
        if kubectl cluster-info > /dev/null 2>&1; then
          echo "✅ SUCCESS: Cluster connection established"
          echo "🏷️  Cluster: $(kubectl config current-context)"
          echo "📊 Default namespace: $(kubectl config view --minify -o jsonpath='{..namespace}' || echo 'not set')"
        else
          echo "❌ FAILED: Unable to connect to Kubernetes cluster"
          exit 1
        fi
        echo ""
        echo "🎉 KUBERNETES CONFIGURATION COMPLETED"
        echo "===================================="

    # =============================================
    # STEP 3: ARGO CD PASSWORD RETRIEVAL
    # =============================================
    - name: "🔐 SECURITY - Argo CD Admin Password Retrieval"
      id: argocd-password
      run: |
        echo "🎯 ARGO CD ADMIN PASSWORD RETRIEVAL"
        echo "==================================="
        echo ""
        echo "🔍 Searching for Argo CD secret in argocd namespace..."
        
        # Verify secret exists
        if kubectl get secret argocd-initial-admin-secret -n argocd > /dev/null 2>&1; then
          echo "✅ Secret 'argocd-initial-admin-secret' found"
          
          # Retrieve password
          echo "📥 Extracting password from secret..."
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
          
          # Verify password is not empty
          if [[ -n "$ARGOCD_PASSWORD" ]]; then
            echo "✅ Password retrieved successfully"
            echo "📏 Password length: ${#ARGOCD_PASSWORD} characters"
            echo "🔐 First and last characters: ${ARGOCD_PASSWORD:0:1}***${ARGOCD_PASSWORD: -1}"
          else
            echo "❌ ERROR: Retrieved password is empty"
            exit 1
          fi
        else
          echo "❌ ERROR: Secret 'argocd-initial-admin-secret' not found in argocd namespace"
          echo "💡 Possible solutions:"
          echo "   - Verify Argo CD is properly installed"
          echo "   - Check cluster access permissions"
          exit 1
        fi
        echo ""
        echo "🎉 PASSWORD RETRIEVED SUCCESSFULLY"
        echo "================================"

    # =============================================
    # STEP 4: ARGO CD AUTHENTICATION
    # =============================================
    - name: "🌐 CONNECTION - Argo CD Server Authentication"
      run: |
        echo "🎯 ARGO CD SERVER AUTHENTICATION"
        echo "================================"
        echo ""
        
        # Define Argo CD URL
        ARGOCD_URL="https://argocd.178.254.23.139.nip.io"
        echo "🔗 Argo CD URL: $ARGOCD_URL"
        echo "👤 Username: admin"
        echo "🎯 Environment: ${{ needs.determine-context.outputs.environment }}"
        echo ""
        
        echo "🔍 Testing connectivity to Argo CD URL..."
        if curl -k -s -I --connect-timeout 10 "$ARGOCD_URL" > /dev/null 2>&1; then
          echo "✅ Argo CD URL is accessible"
        else
          echo "⚠️  Warning: Argo CD URL is not directly accessible"
          echo "🔄 Attempting connection anyway..."
        fi
        echo ""
        
        echo "🔐 Attempting authentication to Argo CD..."
        echo "⏳ This operation may take a few seconds..."
        
        # Authentication attempt with detailed messages
        if argocd login "$ARGOCD_URL" \
          --username admin \
          --password "$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d)" \
          --insecure \
          --grpc-web; then
          
          echo ""
          echo "✅ SUCCESS: Authentication successful to Argo CD"
          echo "🏠 Server: $ARGOCD_URL"
          echo "👤 User: admin"
          echo "🔐 Session: Active"
          
        else
          echo ""
          echo "❌ FAILED: Unable to authenticate to Argo CD"
          echo "🔍 Troubleshooting:"
          echo "   - Verify Argo CD URL"
          echo "   - Check admin credentials"
          echo "   - Verify network connectivity"
          exit 1
        fi
        echo ""
        echo "🎉 ARGO CD CONNECTION ESTABLISHED SUCCESSFULLY"
        echo "=============================================="

    # =============================================
    # STEP 5: APPLICATION SYNCHRONIZATION
    # =============================================
    - name: "🔄 SYNCHRONIZATION - Application Deployment"
      run: |
        echo "🎯 ARGO CD SYNCHRONIZATION"
        echo "=========================="
        echo ""
        
        # Define application name
        APP_NAME="banking-app-${{ needs.determine-context.outputs.environment }}"
        echo "📦 APPLICATION: $APP_NAME"
        echo "🏷️  ENVIRONMENT: ${{ needs.determine-context.outputs.environment }}"
        echo "🐳 IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }}"
        echo ""
        
        echo "🔍 Verifying application existence in Argo CD..."
        if argocd app get "$APP_NAME" > /dev/null 2>&1; then
          echo "✅ Application '$APP_NAME' found in Argo CD"
          echo ""
          
          echo "📊 Current application status:"
          argocd app get "$APP_NAME" --output wide | grep -E "(Name|Namespace|Server|Project|Status|Health)" || true
          echo ""
          
          echo "🔄 STARTING SYNCHRONIZATION..."
          echo "⏳ Initiating manual synchronization..."
          
          # Start synchronization
          if argocd app sync "$APP_NAME"; then
            echo "✅ Synchronization initiated successfully"
            echo ""
            
            echo "⏳ WAITING FOR SYNCHRONIZATION COMPLETION..."
            echo "📈 Monitoring application health status..."
            echo "⏰ Timeout: 600 seconds"
            
            # Wait for application to become healthy
            if argocd app wait "$APP_NAME" --health --timeout 600; then
              echo ""
              echo "✅ SUCCESS: Synchronization completed successfully"
              echo "💚 Application is in 'Healthy' state"
            else
              echo ""
              echo "⚠️  WARNING: Synchronization completed but health status not verified"
              echo "🔍 Manual verification recommended"
            fi
            
          else
            echo "❌ FAILED: Unable to initiate synchronization"
            exit 1
          fi
          
        else
          echo "❌ CRITICAL ERROR: Application '$APP_NAME' not found in Argo CD"
          echo ""
          echo "💡 REQUIRED ACTIONS:"
          echo "   1. Verify application exists in Argo CD"
          echo "   2. Execute script: scripts/create-argocd-apps.sh"
          echo "   3. Check application name in Argo CD UI"
          exit 1
        fi
        echo ""
        echo "🎉 ARGO CD SYNCHRONIZATION COMPLETED"
        echo "==================================="

    # =============================================
    # STEP 6: FINAL VERIFICATION
    # =============================================
    - name: "📊 REPORT - Final Deployment Status"
      run: |
        echo "🎯 FINAL DEPLOYMENT REPORT"
        echo "=========================="
        echo ""
        
        APP_NAME="banking-app-${{ needs.determine-context.outputs.environment }}"
        echo "📋 GENERAL INFORMATION"
        echo "─────────────────────"
        echo "🏷️  Application: $APP_NAME"
        echo "🌍 Environment: ${{ needs.determine-context.outputs.environment }}"
        echo "🐳 Deployed Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }}"
        echo "🕐 Timestamp: $(date -Iseconds)"
        echo ""
        
        echo "📈 ARGO CD STATUS"
        echo "────────────────"
        echo "Complete application details:"
        argocd app get "$APP_NAME" --output wide || echo "⚠️  Unable to retrieve details"
        echo ""
        
        echo "🔍 KUBERNETES RESOURCES"
        echo "──────────────────────"
        NAMESPACE="banking-app-${{ needs.determine-context.outputs.environment }}"
        echo "Namespace: $NAMESPACE"
        echo ""
        echo "Deployed Pods:"
        kubectl get pods -n "$NAMESPACE" --selector=app.kubernetes.io/name=banking-app || echo "No pods found"
        echo ""
        
        echo "Services:"
        kubectl get services -n "$NAMESPACE" --selector=app.kubernetes.io/name=banking-app || echo "No services found"
        echo ""
        
        echo "✅ ARGO CD DEPLOYMENT COMPLETED SUCCESSFULLY"
        echo "🎉 Application is now synchronized and deployed"
        echo "🔗 Argo CD Access: https://argocd.178.254.23.139.nip.io"
        echo "👀 Visual verification recommended in Argo CD UI"

  argocd-sync:
    needs: [determine-context, update-gitops-manifests]
    if: (needs.determine-context.outputs.environment == 'production' || needs.determine-context.outputs.environment == 'staging') && success()
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-context.outputs.environment }}
    
    steps:
    # =============================================
    # STEP 1: ARGO CD CLI INSTALLATION
    # =============================================
    - name: "🔧 INSTALLATION - Argo CD Command Line Interface"
      run: |
        echo "🎯 STARTING ARGO CD CLI INSTALLATION"
        echo "===================================="
        
        # Install Argo CD CLI
        curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
        rm argocd-linux-amd64
        echo "✅ Argo CD CLI installed"

    # =============================================
    # STEP 2: KUBERNETES CONFIGURATION
    # =============================================
    - name: "⚙️  CONFIGURATION - Kubernetes Cluster Access"
      run: |
        echo "🎯 KUBERNETES ACCESS CONFIGURATION"
        echo "=================================="
        
        mkdir -p $HOME/.kube
        
        if [[ "${{ needs.determine-context.outputs.environment }}" == "production" ]]; then
          echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
          echo "✅ Production configuration loaded"
        else
          echo "${{ secrets.K8S_STAGING_CONFIG }}" | base64 -d > $HOME/.kube/config
          echo "✅ Staging configuration loaded"
        fi
        
        chmod 600 $HOME/.kube/config
        echo "✅ Kubernetes configured"

    # =============================================
    # STEP 3: ARGO CD CONNECTION DIAGNOSTICS
    # =============================================
    - name: "🔍 DIAGNOSTICS - Argo CD Connection Testing"
      run: |
        echo "🎯 ARGO CD CONNECTION DIAGNOSTICS"
        echo "================================"
        echo ""
        
        echo "🔍 Testing different URL formats..."
        
        # Test 1: Original URL
        URL1="https://argocd.178.254.23.139.nip.io"
        echo "1. Testing: $URL1"
        curl -k -I --connect-timeout 10 "$URL1" && echo "   ✅ Accessible" || echo "   ❌ Not accessible"
        
        # Test 2: HTTP instead of HTTPS
        URL2="http://argocd.178.254.23.139.nip.io"
        echo "2. Testing: $URL2"
        curl -I --connect-timeout 10 "$URL2" && echo "   ✅ Accessible" || echo "   ❌ Not accessible"
        
        # Test 3: Direct IP with port
        URL3="https://178.254.23.139"
        echo "3. Testing: $URL3"
        curl -k -I --connect-timeout 10 "$URL3" && echo "   ✅ Accessible" || echo "   ❌ Not accessible"
        
        # Test 4: DNS resolution
        echo "4. DNS Resolution:"
        nslookup argocd.178.254.23.139.nip.io || echo "   ❌ DNS resolution failed"
        
        echo ""
        echo "🎯 DIAGNOSTICS COMPLETED"

    # =============================================
    # STEP 4: MULTI-METHOD ARGO CD AUTHENTICATION
    # =============================================
    - name: "🌐 CONNECTION - Multi-Method Argo CD Authentication"
      id: argocd-auth
      run: |
        echo "🎯 ARGO CD MULTI-METHOD AUTHENTICATION"
        echo "======================================"
        echo ""
        
        # Get Argo CD password
        ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
        echo "🔐 Password retrieved successfully"
        echo ""
        
        echo "🔄 ATTEMPTING DIFFERENT CONNECTION METHODS..."
        echo ""
        
        # Method 1: HTTPS with grpc-web (original method)
        echo "1. 🔄 Method: HTTPS with gRPC-web"
        URL1="https://argocd.178.254.23.139.nip.io"
        echo "   URL: $URL1"
        if timeout 30 argocd login "$URL1" \
          --username admin \
          --password "$ARGOCD_PASSWORD" \
          --insecure \
          --grpc-web; then
          echo "   ✅ SUCCESS: Connected via HTTPS + gRPC-web"
          echo "connection_method=https_grpc_web" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "   ❌ FAILED: HTTPS + gRPC-web method"
        fi
        echo ""
        
        # Method 2: HTTPS without grpc-web
        echo "2. 🔄 Method: HTTPS without gRPC-web"
        URL1="https://argocd.178.254.23.139.nip.io"
        echo "   URL: $URL1"
        if timeout 30 argocd login "$URL1" \
          --username admin \
          --password "$ARGOCD_PASSWORD" \
          --insecure; then
          echo "   ✅ SUCCESS: Connected via HTTPS (no gRPC-web)"
          echo "connection_method=https_no_grpc" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "   ❌ FAILED: HTTPS (no gRPC-web) method"
        fi
        echo ""
        
        # Method 3: HTTP instead of HTTPS
        echo "3. 🔄 Method: HTTP (port 80)"
        URL2="http://argocd.178.254.23.139.nip.io"
        echo "   URL: $URL2"
        if timeout 30 argocd login "$URL2" \
          --username admin \
          --password "$ARGOCD_PASSWORD" \
          --insecure; then
          echo "   ✅ SUCCESS: Connected via HTTP"
          echo "connection_method=http" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "   ❌ FAILED: HTTP method"
        fi
        echo ""
        
        # Method 4: Direct IP address
        echo "4. 🔄 Method: Direct IP address"
        URL3="https://178.254.23.139"
        echo "   URL: $URL3"
        if timeout 30 argocd login "$URL3" \
          --username admin \
          --password "$ARGOCD_PASSWORD" \
          --insecure \
          --grpc-web; then
          echo "   ✅ SUCCESS: Connected via direct IP"
          echo "connection_method=direct_ip" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "   ❌ FAILED: Direct IP method"
        fi
        echo ""
        
        # Method 5: Port-forward approach (fallback)
        echo "5. 🔄 Method: Kubernetes Port-Forward"
        echo "   Setting up local port forwarding..."
        kubectl port-forward svc/argocd-server -n argocd 8080:443 &
        PF_PID=$!
        sleep 5
        
        if timeout 30 argocd login localhost:8080 \
          --username admin \
          --password "$ARGOCD_PASSWORD" \
          --insecure; then
          echo "   ✅ SUCCESS: Connected via port-forward"
          # Store PID for cleanup in next step
          echo "$PF_PID" > /tmp/argocd_pf.pid
          echo "connection_method=port_forward" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "   ❌ FAILED: Port-forward method"
          kill $PF_PID 2>/dev/null || true
        fi
        echo ""
        
        echo "❌ CRITICAL: All connection methods failed"
        echo "💡 Please check:"
        echo "   - Argo CD server status"
        echo "   - Network connectivity"
        echo "   - Firewall rules"
        echo "   - DNS configuration"
        exit 1

    # =============================================
    # STEP 5: APPLICATION SYNCHRONIZATION
    # =============================================
    - name: "🔄 SYNCHRONIZATION - Application Deployment"
      run: |
        echo "🎯 ARGO CD SYNCHRONIZATION"
        echo "=========================="
        echo ""
        
        APP_NAME="banking-app-${{ needs.determine-context.outputs.environment }}"
        echo "📦 Application: $APP_NAME"
        echo "🔗 Connection Method: ${{ steps.argocd-auth.outputs.connection_method }}"
        echo ""
        
        echo "🔍 Verifying application exists..."
        if argocd app get "$APP_NAME" > /dev/null 2>&1; then
          echo "✅ Application found in Argo CD"
          echo ""
          
          echo "📊 Pre-sync status:"
          argocd app get "$APP_NAME" --output jsonpath="{.status.sync.status}/{.status.health.status}" || true
          echo ""
          
          echo "🔄 Starting synchronization..."
          if argocd app sync "$APP_NAME"; then
            echo "✅ Sync initiated successfully"
            echo ""
            
            echo "⏳ Waiting for sync completion (timeout: 600s)..."
            if argocd app wait "$APP_NAME" --health --timeout 600; then
              echo "✅ Sync completed successfully - Application is healthy"
            else
              echo "⚠️  Sync completed but health check timeout"
            fi
          else
            echo "❌ Sync initiation failed"
            exit 1
          fi
        else
          echo "❌ Application not found: $APP_NAME"
          exit 1
        fi

    # =============================================
    # STEP 6: CLEANUP AND FINAL STATUS
    # =============================================
    - name: "🧹 CLEANUP - Resource Cleanup"
      if: always()
      run: |
        echo "🎯 CLEANUP PROCESS"
        echo "=================="
        echo ""
        
        # Cleanup port-forward if it was used
        if [[ -f /tmp/argocd_pf.pid ]]; then
          PF_PID=$(cat /tmp/argocd_pf.pid)
          echo "🔄 Stopping port-forward process (PID: $PF_PID)..."
          kill $PF_PID 2>/dev/null || true
          rm -f /tmp/argocd_pf.pid
          echo "✅ Port-forward cleanup completed"
        fi
        
        echo ""
        echo "🎉 CLEANUP COMPLETED"

    # =============================================
    # STEP 7: FINAL DEPLOYMENT REPORT
    # =============================================
    - name: "📊 REPORT - Final Deployment Status"
      if: always()
      run: |
        echo "🎯 FINAL DEPLOYMENT REPORT"
        echo "=========================="
        echo ""
        
        APP_NAME="banking-app-${{ needs.determine-context.outputs.environment }}"
        echo "📋 DEPLOYMENT SUMMARY"
        echo "─────────────────────"
        echo "🏷️  Application: $APP_NAME"
        echo "🌍 Environment: ${{ needs.determine-context.outputs.environment }}"
        echo "🔗 Connection Method: ${{ steps.argocd-auth.outputs.connection_method }}"
        echo "🐳 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-context.outputs.image-tag }}"
        echo "🕐 Completion Time: $(date -Iseconds)"
        echo ""
        
        echo "📈 ARGO CD STATUS"
        echo "────────────────"
        # Try to get final status, but don't fail if we can't
        argocd app get "$APP_NAME" --output wide || echo "⚠️  Unable to retrieve final status"
        echo ""
        
        echo "🔍 KUBERNETES STATUS"
        echo "───────────────────"
        NAMESPACE="banking-app-${{ needs.determine-context.outputs.environment }}"
        echo "Namespace: $NAMESPACE"
        echo ""
        echo "Pods:"
        kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=banking-app || echo "No pods found"
        
        echo ""
        echo "✅ ARGO CD SYNCHRONIZATION PROCESS COMPLETED"
        echo "🎉 Application is synchronized and deployed"


  verification:
    needs: [determine-context, update-gitops-manifests, argocd-sync]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-context.outputs.environment }}
    outputs:
      result: ${{ steps.result.outputs.status }}
    steps:
    - name: Debug verification
      run: |
        echo "🔍 VERIFICATION:"
        echo "Environment: ${{ needs.determine-context.outputs.environment }}"
        echo "Image Tag: ${{ needs.determine-context.outputs.image-tag }}"

    - name: Configure Kubernetes for verification
      run: |
        mkdir -p $HOME/.kube
        if [[ "${{ needs.determine-context.outputs.environment }}" == "production" ]]; then
          echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > $HOME/.kube/config
        else
          echo "${{ secrets.K8S_STAGING_CONFIG }}" | base64 -d > $HOME/.kube/config
        fi
        chmod 600 $HOME/.kube/config

    - name: Verify deployment
      run: |
        NAMESPACE="banking-app-${{ needs.determine-context.outputs.environment }}"
        echo "🔍 Verifying deployment in namespace: $NAMESPACE"
        
        # Vérifier que les pods sont en cours d'exécution
        kubectl get pods -n $NAMESPACE
        
        # Vérifier le statut du déploiement
        kubectl rollout status deployment/banking-app -n $NAMESPACE --timeout=300s
        
        echo "✅ Deployment verified successfully"

    - name: Set result
      id: result
      run: |
        echo "status=success" >> $GITHUB_OUTPUT

  notify:
    needs: [determine-context, verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Debug notification
      run: |
        echo "📢 NOTIFICATION:"
        echo "Environment: ${{ needs.determine-context.outputs.environment }}"
        echo "Image Tag: ${{ needs.determine-context.outputs.image-tag }}"
        echo "Status: ${{ needs.verification.result }}"

    - name: Send deployment notification
      run: |
        ENV="${{ needs.determine-context.outputs.environment }}"
        TAG="${{ needs.determine-context.outputs.image-tag }}"
        STATUS="${{ needs.verification.result }}"
        
        if [[ "$STATUS" == "success" ]]; then
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "Environment: $ENV"
          echo "Image: $TAG"
          echo "Status: ✅ Success"
        else
          echo "❌ DEPLOYMENT FAILED"
          echo "Environment: $ENV"
          echo "Image: $TAG"
          echo "Status: ❌ Failed"
        fi

  debug-all-outputs:
    needs: [determine-context, build-and-test, update-gitops-manifests]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Show all outputs
      run: |
        echo "🎯 DETERMINE-CONTEXT OUTPUTS:"
        echo "  environment: '${{ needs.determine-context.outputs.environment }}'"
        echo "  image-tag: '${{ needs.determine-context.outputs.image-tag }}'"
        
        echo ""
        echo "🔍 ARGO-CD-SYNC CONDITION:"
        echo "  environment == 'production': ${{ needs.determine-context.outputs.environment == 'production' }}"
        echo "  environment == 'staging': ${{ needs.determine-context.outputs.environment == 'staging' }}"
        echo "  Condition result: ${{ (needs.determine-context.outputs.environment == 'production' || needs.determine-context.outputs.environment == 'staging') && true }}"
        
        echo ""
        echo "📊 JOB STATUS:"
        echo "  determine-context: ${{ job.status }}"
        echo "  build-and-test: ${{ needs.build-and-test.result }}"
        echo "  update-gitops-manifests: ${{ needs.update-gitops-manifests.result }}"