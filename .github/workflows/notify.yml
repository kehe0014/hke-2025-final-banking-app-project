name: Deployment Notification

# Ce workflow est appelé par un autre workflow (workflow_call).
# Il est conçu pour être réutilisé.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: The target deployment environment (e.g., staging, production).
      image_tag:
        required: true
        type: string
        description: The tag of the Docker image that was deployed.
      status:
        required: true
        type: string
        description: The result status of the preceding job (success, failure, cancelled).
    secrets:
      SLACK_WEBHOOK_URL:
        required: false
        description: Webhook URL for Slack notifications.

jobs:
  notify:
    runs-on: ubuntu-latest
    name: Final Notification

    steps:
      - name: Display Deployment Summary
        run: |
          echo "=========================================="
          echo "🚀 RÉSUMÉ DE LA NOTIFICATION DE DÉPLOIEMENT"
          echo "=========================================="

      - name: Create GitHub comment
        run: echo "Simulation d'une étape de commentaire GitHub..."