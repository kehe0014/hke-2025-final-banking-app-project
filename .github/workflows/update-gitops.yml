name: Update GitOps Manifests

on:
  workflow_call:
    inputs:
      gitops_path:
        required: true
        type: string
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      GHA_TOKEN:
        required: true

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GHA_TOKEN }}

    - name: Debug parameters
      run: |
        echo "🔍 PARAMETER DEBUG:"
        echo "inputs.gitops_path: '${{ inputs.gitops_path }}'"
        echo "inputs.environment: '${{ inputs.environment }}'"
        echo "inputs.image_tag: '${{ inputs.image_tag }}'"
        echo "needs.build-and-test.outputs.image-tag: '${{ needs.build-and-test.outputs.image-tag }}'"
        echo "needs.build-and-test.outputs.environment: '${{ needs.build-and-test.outputs.environment }}'"
        echo ""
        echo "📁 VERIFYING STRUCTURE:"
        echo "Current directory: $(pwd)"
        echo "GitOps path exists: $(test -d '${{ inputs.gitops_path }}' && echo 'YES' || echo 'NO')"
        echo "Overlays exist: $(test -d '${{ inputs.gitops_path }}/overlays' && echo 'YES' || echo 'NO')"
        echo "Environment overlay exists: $(test -d '${{ inputs.gitops_path }}/overlays/${{ inputs.environment }}' && echo 'YES' || echo 'NO')"
        echo ""
        echo "📄 LISTING FILES:"
        find "${{ inputs.gitops_path }}/overlays/${{ inputs.environment }}" -name "*.yaml" -o -name "*.yml" | sort

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Update manifests with new image tag
      run: |
        echo "🚀 EXECUTING UPDATE SCRIPT:"
        echo "Parameters passed to script:"
        echo "  Environment: '${{ inputs.environment }}'"
        echo "  Image Tag: '${{ inputs.image_tag }}'"
        echo "  GitOps Path: '${{ inputs.gitops_path }}'"
        
        chmod +x .github/scripts/update-manifests.sh
        ./.github/scripts/update-manifests.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}" "${{ inputs.gitops_path }}"

    - name: Commit and push changes
      run: |
        echo "📦 CHECKING FOR CHANGES:"
        git status
        git diff
        
        if git diff --quiet; then
          echo "🤷 No changes to commit"
        else
          echo "💾 Committing changes..."
          git add .
          git commit -m "chore: update ${{ inputs.environment }} to image ${{ inputs.image_tag }} [skip ci]"
          git push origin ${{ github.ref }}
          echo "✅ GitOps manifests updated and pushed"
        fi