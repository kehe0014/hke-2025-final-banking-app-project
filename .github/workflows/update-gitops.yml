name: Update GitOps Manifests

on:
  workflow_call:
    inputs:
      gitops_path:
        required: true
        type: string
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      GHA_TOKEN:
        required: true

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GHA_TOKEN }}

    - name: Debug parameters
      run: |
        echo "🎯 UPDATE GITOPS INPUTS:"
        echo "gitops_path: ${{ inputs.gitops_path }}"
        echo "environment: ${{ inputs.environment }}"
        echo "image_tag: ${{ inputs.image_tag }}"

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Update manifests with new image tag
      run: |
        echo "🚀 Executing update script..."
        chmod +x .github/scripts/update-manifests.sh
        ./.github/scripts/update-manifests.sh "${{ inputs.environment }}" "${{ inputs.image_tag }}" "${{ inputs.gitops_path }}"

    - name: Commit and push changes
      run: |
        echo "📦 Checking for changes..."
        git status
        
        if git diff --quiet; then
          echo "🤷 No changes to commit"
        else
          echo "💾 Committing changes..."
          git add .
          git commit -m "chore: update ${{ inputs.environment }} to image ${{ inputs.image_tag }} [skip ci]"
          git push origin ${{ github.ref }}
          echo "✅ GitOps manifests updated and pushed"
        fi