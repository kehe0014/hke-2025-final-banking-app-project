name: Deployment Verification

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  verification:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
    - name: Simple verification
      run: |
        echo "✅ Verification completed for ${{ inputs.environment }}"
        echo "Image tag: ${{ inputs.image_tag }}"