apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hehe0014/banking-app-gitops.git'
    targetRevision: HEAD
    path: overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: banking-app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true