apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app
  labels:
    app.kubernetes.io/name: banking-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: banking-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-app
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: banking-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: banking-app
        image: tdksoft341/tdk-banking-app:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-app
          containerPort: 8000
        - name: http-metrics
          containerPort: 8080
        env:
        - name: DEBUG
          value: "False"
        - name: ALLOWED_HOSTS
          value: "banking.votredomaine.com,localhost,127.0.0.1,.votredomaine.com"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"
        - name: PROMETHEUS_METRICS_PORT
          value: "8080"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: DATABASE_URL
        args: 
        - "gunicorn"
        - "bankingsystem.wsgi:application"
        - "--bind"
        - "0.0.0.0:8000"
        - "--workers"
        - "4"
        - "--timeout"
        - "120"
        - "--access-logfile"
        - "-"
        - "--error-logfile"
        - "-"
        livenessProbe:
          httpGet:
            path: /health
            port: http-app
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http-app
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp

      - name: redis
        image: redis:7-alpine
        ports:
        - name: redis
          containerPort: 6379
        command:
        - "redis-server"
        - "--appendonly"
        - "yes"
        - "--requirepass"
        - "banking-redis-pass"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5

      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: redis-data
        emptyDir: {}