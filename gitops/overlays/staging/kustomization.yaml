apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-app-staging

resources:
  - ../../base

# ✅ Utilisation du champ "labels" au format attendu par kustomize >= v5
labels:
  - pairs:
      environment: staging
      app.kubernetes.io/version: "1.0.0"

patches:
  - path: patch-deployment.yaml
  - path: patch-ingress.yaml

images:
  - name: tdksoft341/tdk-banking-app
    newTag: "develop-ccf24421"
  - name: redis
    newTag: "develop-ccf24421"
