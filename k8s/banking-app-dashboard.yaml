apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-app-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  banking-app-dashboard.json: |-
    {
      "dashboard": {
        "id": null,
        "title": "Banking Application Monitoring",
        "tags": ["banking", "production"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Application Availability",
            "type": "stat",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "up{job=~\"banking-app.*\", namespace=\"banking-app-prod\"}",
                "legendFormat": "{{pod}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            }
          },
          {
            "id": 2,
            "title": "CPU Usage",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{container=~\"banking-app.*\", namespace=\"banking-app-prod\"}[5m]) * 100",
                "legendFormat": "{{pod}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": 0
              }
            }
          },
          {
            "id": 3,
            "title": "Memory Usage",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "container_memory_usage_bytes{container=~\"banking-app.*\", namespace=\"banking-app-prod\"}",
                "legendFormat": "{{pod}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "bytes",
                "min": 0
              }
            }
          },
          {
            "id": 4,
            "title": "HTTP Requests Rate",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "rate(http_requests_total{namespace=\"banking-app-prod\"}[5m])",
                "legendFormat": "Requests/s"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "min": 0
              }
            }
          },
          {
            "id": 5,
            "title": "HTTP Response Status Codes",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"2..\", namespace=\"banking-app-prod\"}[5m])",
                "legendFormat": "2xx"
              },
              {
                "expr": "rate(http_requests_total{status=~\"4..\", namespace=\"banking-app-prod\"}[5m])",
                "legendFormat": "4xx"
              },
              {
                "expr": "rate(http_requests_total{status=~\"5..\", namespace=\"banking-app-prod\"}[5m])",
                "legendFormat": "5xx"
              }
            ]
          },
          {
            "id": 6,
            "title": "Response Time (95th percentile)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace=\"banking-app-prod\"}[5m]))",
                "legendFormat": "95th percentile"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "min": 0
              }
            }
          },
          {
            "id": 7,
            "title": "Active Transactions",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
            "targets": [
              {
                "expr": "banking_app_transactions_active{namespace=\"banking-app-prod\"}",
                "legendFormat": "Active Transactions"
              }
            ]
          },
          {
            "id": 8,
            "title": "Database Connections",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
            "targets": [
              {
                "expr": "banking_app_db_connections_active{namespace=\"banking-app-prod\"}",
                "legendFormat": "Active Connections"
              }
            ]
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "10s"
      }
    }