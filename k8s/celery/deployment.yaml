apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: banking-app
  labels:
    app: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: tdksoft341/tdk-banking-app:v1.0.0
        command: ["celery"]
        args: ["-A", "bankingsystem", "worker", "--loglevel=info"]
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: banking-app-config
              key: DEBUG
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: DATABASE_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: banking-app-config
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            configMapKeyRef:
              name: banking-app-config
              key: CELERY_RESULT_BACKEND
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
