apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app
  namespace: banking-app-prod
  labels:
    app: banking-app
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: banking-app
  template:
    metadata:
      labels:
        app: banking-app
        environment: production
    spec:
      containers:
      - name: banking-app
        image: tdksoft341/tdk-banking-app:v1.0.0  # Sera remplacé par le workflow
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "False"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: DATABASE_URL
        - name: ALLOWED_HOSTS
          value: "banking.votredomaine.com,localhost,127.0.0.1,.votredomaine.com"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Health checks désactivés pour l'instant
        command: ["/bin/sh"]
        args: ["-c", "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn bankingsystem.wsgi:application --bind 0.0.0.0:8000"]