apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-app-ingress
  namespace: banking-app-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Si vous avez cert-manager
spec:
  tls:
  - hosts:
    - banking.votredomaine.com
    secretName: banking-app-tls
  rules:
  - host: banking.votredomaine.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: banking-app-service
            port:
              number: 8000