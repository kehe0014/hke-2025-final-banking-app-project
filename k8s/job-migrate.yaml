apiVersion: batch/v1
kind: Job
metadata:
  name: banking-app-migrate
  namespace: banking-app
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: tdksoft341/tdk-banking-app:v1.0.0
        command: ["python", "manage.py", "migrate"]
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: banking-app-config
              key: DEBUG
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: banking-app-secrets
              key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 3